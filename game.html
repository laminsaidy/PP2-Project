<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for character set, compatibility, and viewport settings -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta tags for description and keywords -->
    <meta name="description" content="RPSLS Game">
    <meta name="keywords" content="Rock Paper Scissors Lizard Spock, Game">
    
    <!-- Title of the page -->
    <title>RPSLS Game</title>
    
    <!-- Linking the external stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Main container for the game -->
    <div class="container">
        <!-- Game header -->
        <h1>Welcome to RPSLS Game!</h1>
        
        <!-- Input field for username -->
        <input type="text" id="username" placeholder="Enter your name">
        
        <!-- Button to start the game -->
        <button id="startGameBtn" type="button">Start Game</button>

        
        <!-- Instructions text that will be updated -->
        <div id="instructions"></div>
        
        <!-- Buttons for player's choice (Rock, Paper, Scissors, Lizard, Spock) -->
        <div id="choices" style="display:none;">
            <button class="choice" value="rock">Rock</button>
            <button class="choice" value="paper">Paper</button>
            <button class="choice" value="scissors">Scissors</button>
            <button class="choice" value="lizard">Lizard</button>
            <button class="choice" value="spock">Spock</button>
        </div>
        
        <!-- Display for the round result -->
        <div id="round-result">
            <p id="computer-choice"></p>
            <p id="result-text"></p>
        </div>
        
        <!-- Scoreboard for player and computer scores -->
        <div id="scoreboard">
            <div id="player-score">Player Score: 0</div>
            <div id="computer-score">Computer Score: 0</div>
        </div>
        
        <!-- Final game result display -->
        <div id="game-result"></div>
        
        <!-- Button to play again, initially hidden -->
        <button id="playAgainBtn" style="display:none;">Play Again</button>

        <!-- Link to return to the main page -->
        <a href="index.html" id="backToMainPageBtn">Back to Main Page</a>
    </div>
    
    <!-- Container for displaying past scores -->
    <div class="past-scores-container">
        <h3>Best Scores</h3>
        <table id="past-scores-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Player Score</th>
                    <th>Computer Score</th>
                </tr>
            </thead>
            <tbody>
                <!-- Scores will be dynamically added here -->
            </tbody>
        </table>
    </div>
    
    <!-- Footer with copyright and designer credit -->
    <footer>
        <div class="footercontainer">
            <p>Copy right &copy;2024; Designed by <span class="designer"><a href="https://github.com/laminsaidy/PP2-Project" target="_blank">Lamin</a></span></p>
        </div>
    </footer>

    <!-- Linking the external JavaScript file -->
    <script src="assets/js/script.js"></script>
</body>
</html>
